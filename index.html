<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深海文物核心</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #031426; /* 深海暗蓝 */
        }

        canvas {
            display: block;
        }
    </style>

    <!-- 从 CDN 加载 Three.js；首次运行需要联网 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
    // 场景与相机
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x031426);
    scene.fog = new THREE.FogExp2(0x031426, 0.035);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.z = 7;

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 中央的发光线框球体：作为“文物核心”
    const sphereGeometry = new THREE.SphereGeometry(1.5, 32, 24);
    const sphereMaterial = new THREE.MeshBasicMaterial({
        color: 0x42ffd2,
        wireframe: true,
        transparent: true,
        opacity: 0.85
    });
    const core = new THREE.Mesh(sphereGeometry, sphereMaterial);
    scene.add(core);

    // 球心添加一层柔和光晕
    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(1.25, 24, 18),
        new THREE.MeshBasicMaterial({
            color: 0x087e9b,
            transparent: true,
            opacity: 0.12
        })
    );
    scene.add(glow);

    // 海底气泡 / 光点粒子
    const particleCount = 700;
    const positions = new Float32Array(particleCount * 3);
    const speeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        positions[i3] = (Math.random() - 0.5) * 18;      // x
        positions[i3 + 1] = (Math.random() - 0.5) * 12; // y
        positions[i3 + 2] = (Math.random() - 0.5) * 14; // z
        speeds[i] = 0.002 + Math.random() * 0.008;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
    );

    const particleMaterial = new THREE.PointsMaterial({
        color: 0xd8f7ff,
        size: 0.045,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // 动画
    function animate() {
        requestAnimationFrame(animate);

        core.rotation.x += 0.002;
        core.rotation.y += 0.004;
        glow.rotation.copy(core.rotation);

        // 光点缓慢上浮，到顶部后从底部重新出现
        const positionAttribute = particleGeometry.attributes.position;
        for (let i = 0; i < particleCount; i++) {
            const yIndex = i * 3 + 1;
            positionAttribute.array[yIndex] += speeds[i];

            if (positionAttribute.array[yIndex] > 6) {
                positionAttribute.array[yIndex] = -6;
            }
        }
        positionAttribute.needsUpdate = true;

        renderer.render(scene, camera);
    }

    animate();

    // 窗口尺寸变化时同步更新相机和画布
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
